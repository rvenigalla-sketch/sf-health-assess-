# sf-health default configuration.
# Override per client by passing --config <file>; keys are deep-merged over these defaults.

# full          : run every tool, including org-querying tools (Org Check, hardis, Health Check).
# metadata-only : retrieved metadata + Code Analyzer only. Use when the client was promised
#                 "metadata only".
dataPolicy: full

# Where runs are written: <workspaceRoot>/<client>/<YYYY-MM-DD>/...
workspaceRoot: ./health-runs

retrieve:
  # Max members per retrieve chunk. Salesforce caps a retrieve at 10,000 files / ~39 MB;
  # members expand into several files (e.g. an object), so stay well under.
  chunkSize: 2000
  waitMinutes: 33
  retries: 2
  # Profiles and permission sets only carry field/object/class access for components in the same
  # retrieve, so they are fetched in a separate pass: this many per chunk, together with the related
  # types (split into groups of at most accessRelatedChunkSize members; defaults to chunkSize).
  accessChunkSize: 25
  accessRelatedChunkSize: 2000
  # Retrieve chunks run at the same time (each into its own staging folder, merged afterwards).
  # Same files and API calls as one at a time, just overlapped. 1 = one after another.
  parallel: 2
  # Metadata types never retrieved: high volume, no value for a health review.
  excludeTypes:
    - Document
    - StaticResource
    - ContentAsset
    - Report
    - Dashboard
    - EmailTemplate
    - Letterhead
    - Translations
    - CustomObjectTranslation
    - StandardValueSetTranslation
    # Listed by the manifest but not retrievable in most orgs (retrieve reports "not available").
    - UiViewDefinition
    - WorkflowFlowAutomation
  # Skip components in installed managed-package namespaces (not changeable by the client).
  excludeManagedPackages: true
  # Warn and stop if remaining daily API requests fall below this share.
  minApiHeadroom: 0.2

tools:
  codeAnalyzer:
    enabled: true
    ruleSelector: all
  orgCheck:
    enabled: true
    # Org Check requires accepting its terms of use to run against production orgs.
    # Set true only once A360 has accepted them; otherwise Org Check fails on production.
    acceptTerms: false
    views:
      - global-view
      - hardcoded-urls
  hardis:
    enabled: true
    # Setup Audit Trail stays off: frequent direct-to-prod changes make it noise.
    auditTrail: false
    commands:
      - hardis:org:diagnose:unusedusers
      - hardis:org:diagnose:unusedlicenses
      - hardis:org:diagnose:unused-apex-classes
      - hardis:org:diagnose:underusedpermsets
      - hardis:org:diagnose:unsecure-connected-apps
      - hardis:org:diagnose:legacyapi
      - hardis:org:diagnose:releaseupdates
      - hardis:org:diagnose:apex-api-version
      - hardis:org:diagnose:unsecure-permissions
      - hardis:org:monitor:limits
      - hardis:org:monitor:errors --days 30
  healthCheck:
    enabled: true

evidence:
  # Code Analyzer findings passed to reviewers: severity 1-3 (1 = Critical .. 5 = Info),
  # minus style-only rules. Everything else is still counted in metrics.json (ruleCounts).
  maxSeverity: 3
  excludeRules:
    - MethodNamingConventions
    - LocalVariableNamingConventions
    - FormalParameterNamingConventions
    - PropertyNamingConventions
    - FieldNamingConventions
    - ClassNamingConventions
    - IfElseStmtsMustUseBraces
    - IfStmtsMustUseBraces
    - ForLoopsMustUseBraces
    - WhileLoopsMustUseBraces
    - NoMixedIndentation
    - NoTrailingWhitespace
    - UnusedLocalVariable
    - no-magic-numbers
  # Included regardless of severity.
  includeRules: []

sanitize:
  # Strip record IDs and quoted field values from runtime error text before any agent sees it.
  redactErrorRecordData: true

shards:
  # Source tokens per review shard (keeps each reviewer well under its context window).
  tokenBudget: 45000
  # Max components per shard: beyond this, attention spreads thin even when tokens fit.
  maxComponents: 30
  maxAgentsPerRun: 300

scoring:
  # area score = 100 x exp(-sum(severity weights) / scale); overall = weighted mean of areas.
  severityWeights: {Critical: 25, High: 10, Medium: 4, Low: 1}
  scale: 60
  good: 80
  fair: 60
  areaWeights: {security: 1.5, automation: 1.25, apex: 1, flow: 1, datamodel: 0.75, crma: 0.75, release: 0.75, integration: 0.75}

models:
  # true (required): reviewers, verifiers and the synthesizer run as the plugin's subagent types
  # (sf-health:<name>), which Claude Code restricts to the tools in agents/*.md frontmatter (Read/Grep/Glob).
  # Needs sf-health installed as a plugin. The workflows refuse to run with false unless
  # allowUnrestrictedAgents is also true.
  useAgentTypes: true
  # DEV ONLY, never for a client org: with useAgentTypes false, run default workflow agents (which have
  # Bash/Write/Edit) and rely on the prompt alone to keep them read-only. Logs a loud warning.
  allowUnrestrictedAgents: false
  reviewer: sonnet
  verifier: opus
  # Model for re-checking High findings a tool rule already flagged. Default opus: accuracy first.
  # Setting sonnet saves tokens with slightly weaker re-checks; Critical and model-only findings always use `verifier`.
  verifierLight: opus
  synthesizer: opus

followUp:
  maxRounds: 1
  maxAgents: 20

verify:
  # Each verifier (opus) costs ~40k tokens. Critical first, then High; the rest stay "unverified".
  maxFindings: 60

# Script-made findings for facts the index already computes exactly (no tokens, same every run).
# Reviewers are told these are already reported so they don't repeat them.
ruleChecks:
  enabled: true
  # Apex classes / triggers / flows below this API version are reported as old.
  minApiVersion: 51.0

# Repeat runs of the same org (plan_shards.py --baseline auto): only components that changed since the
# previous snapshot are reviewed again, plus anything that calls / is called by them or uses a changed
# object or field. Findings on unchanged components are carried forward with their verifier verdict and
# re-checked against the new files. For INTERIM checks only: a client deliverable is always a full
# review (--baseline none, the default), so the assessment never depends on an older review.
incremental:
  enabled: true

# Local finding library: consultant decisions (accept / edit / reject) from every run, with
# component, object and client names replaced by placeholders. Never committed, never uploaded.
# Used for "seen before" hints in the review sheet and to warn reviewers about known false positives.
library:
  enabled: true
  path: ~/.sf-health/library.jsonl
  # A pattern rejected this many times (and never accepted) counts as a known false positive.
  falsePositiveAfter: 2
  # false (default, accuracy first): known false positives are only shown to the consultant in the review
  # sheet; reviewers still look for everything. true: reviewers are also told about them, which saves
  # review time but risks missing a real issue that looks like an old false positive.
  warnReviewers: false
